name: Manual verification

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Verification suite (coverage measures JavaScript tooling)
        type: choice
        options: [full, smoke, coverage]
        default: full
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm run deps
      - name: Full verification
        if: inputs.suite == 'full'
        run: npm run verify
      - name: Commit smoke suite
        if: inputs.suite == 'smoke'
        run: npm run smoke
      - name: JavaScript tooling coverage and full verification
        if: inputs.suite == 'coverage'
        run: npm run coverage
